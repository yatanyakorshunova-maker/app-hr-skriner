services:
  - type: web
    name: hr-backend
    runtime: python
    repo: https://github.com/yatanyakorshunova-maker/app-hr-skriner
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
